[project]
name = "islamou-dini-backend"
version = "0.1.0"
description = "Django REST API backend for Islamou Dini"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-cors-headers>=4.3.0",
    "mysqlclient>=2.2.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
